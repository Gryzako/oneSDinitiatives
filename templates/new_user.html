{% extends "base.html" %}
{% block content %}
<a href="{{ url_for('users') }}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-brand mb-4">&larr; Users</a>
<div class="max-w-md">
    <h1 class="text-2xl font-semibold tracking-tight mb-6">Add user</h1>
    <form action="{{ url_for('new_user') }}" method="POST" class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">
        <div>
            <label for="user_name" class="block text-sm font-medium text-slate-700 mb-1">User name</label>
            <input type="text" id="user_name" name="user_name" value="{{ user.user_name }}" required autofocus>
        </div>
        <div>
            <label for="full_name" class="block text-sm font-medium text-slate-700 mb-1">Full name</label>
            <input type="text" id="full_name" name="full_name" value="{{ user.full_name or '' }}" placeholder="e.g. Michał Grysiński">
            <p class="text-xs text-slate-500 mt-1">Shown in the Responsible picker – use the real spelling incl. Polish letters.</p>
        </div>
        <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" required>
        </div>
        <div>
            <label for="user_pass" class="block text-sm font-medium text-slate-700 mb-1">Initial password</label>
            <input type="password" id="user_pass" name="user_pass" required autocomplete="new-password">
            <p class="text-xs text-slate-500 mt-1">New users are active editors. Grant admin rights from the user list.</p>
        </div>
        <div class="flex justify-end gap-2 pt-2">
            <a href="{{ url_for('users') }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Create user</button>
        </div>
    </form>
</div>
{% endblock %}
