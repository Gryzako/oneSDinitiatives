{% extends "base.html" %}
{% block content %}
<div class="flex justify-center items-center min-h-[60vh]">
    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
            <p class="text-sm text-slate-500 mt-1">to add and update initiatives</p>
        </div>
        <form method="POST" action="{{ url_for('login') }}" class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 space-y-4">
            <div>
                <label for="user_name" class="block text-sm font-medium text-slate-700 mb-1">User name</label>
                <input type="text" id="user_name" name="user_name" required autofocus autocomplete="username">
            </div>
            <div>
                <label for="user_pass" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="user_pass" name="user_pass" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary w-full justify-center">Sign in</button>
        </form>
        <p class="text-xs text-slate-500 text-center mt-4">No account or forgot your password? <a href="{{ url_for('about') }}" class="text-brand hover:underline">Contact an administrator</a>.</p>
    </div>
</div>
{% endblock %}
